    <title>Evgeni Melan | RealityForge</title>
    <script>
      (() => {
        const themeColor = document.querySelector('meta[name="theme-color"]');
        const themeStorageKey = "realityforge-theme";
        let theme = "light";

        try {
          const savedTheme = localStorage.getItem(themeStorageKey);
          theme = savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (error) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        themeColor.setAttribute("content", theme === "dark" ? "#090d14" : "#f8f6f2");
      })();
    </script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/evgeni/card.css">
    <script src="/script.js" defer></script>
  </head>
